<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="konteynir">

        <nav>

            <a href="index.html">Hakkımda</a> |
            <a href="ozgecmis.html">Özgeçmiş</a> |
            <a href="sehrim.html">Şehrim</a> |
            <a href="mirasimiz.html">Takımımız</a> |
            <a href="ilgialanlarim.html">İlgi Alanlarım</a> |
            <a href="iletisim.html">İletişim</a> |
            <a href="login.html">Login</a>
        </nav>
    </div>



    <div class="ilgi-container">
        <div class="menu2">
            <button onclick="filmleriGetir()">🎬 Dizi / Film</button>
            <button onclick="yerleriGoster()">🌍 Yolculuk</button>
            <button onclick="kitaplariGetir()">📚 Kitap</button>
        </div>

        <div id="icerik"></div>
    </div>


    <script>

        // 🎬 FİLMLER

        const filmListem = [
            { id: 3580, tip: "movie" },   // Sahtekar (film)
            { id: 7225, tip: "tv" },      // Merlin (dizi)

            { id: 48891, tip: "tv" },      // Brooklyn Nine-Nine (dizi)
            { id: 46952, tip: "tv" },      // The Blacklist (dizi)


            { id: 490132, tip: "movie" },   // Yeşil Rehber (film)
            { id: 296096, tip: "movie" },   // Senden Önce Ben (film)

            { id: 13804, tip: "movie" },   // fast and furious
            { id: 67070, tip: "tv" },   // fleabag
            { id: 65143, tip: "tv" },      // Güneşin Torunları





        ];

        async function filmleriGetir() {
            const apiKey = "90e9ba554b8bd92ee04333f722479f8d";
            const alan = document.getElementById("icerik");
            alan.innerHTML = "<h2>🎬 Sevdiğim Film & Diziler</h2>";

            for (let item of filmListem) {
                const url = `https://api.themoviedb.org/3/${item.tip}/${item.id}?api_key=${apiKey}`;
                const cevap = await fetch(url);
                const veri = await cevap.json();

                const poster = veri.poster_path
                    ? "https://image.tmdb.org/t/p/w500" + veri.poster_path
                    : "";

                alan.innerHTML += `
        <div class="card">
            <img src="${poster}">
            <h3>${veri.title || veri.name}</h3>
            <p>⭐ ${veri.vote_average}</p>
        </div>
    `;
            }
        }

        // 🌍 YOLCULUK
        const yerler = [
            { ad: "Mısır", foto: "img/misir.jpg" },
            { ad: "İskoçya", foto: "img/iskocya.jpg" },
            { ad: "Japonya", foto: "img/japonya.jpg" },
            { ad: "Tayland", foto: "img/tayland.jpg" },
            { ad: "İsviçre", foto: "img/isvicre.jpg" }
        ];

        function yerleriGoster() {
            const alan = document.getElementById("icerik");
            alan.innerHTML = "<h2>🌍 Gitmek İstediğim Yerler</h2>";

            yerler.forEach(function (yer) {
                alan.innerHTML += `
      <div class="card">
        <img src="${yer.foto}" alt="${yer.ad}">
        <h3>${yer.ad}</h3>
      </div>
    `;
            });
        }
        const kitapListem = [
            { eser: "İcatlarım ve Hayatım", yazar: "Nikola Tesla" },
            { eser: "Bugünü Yaşama Arzusu", yazar: "Irvin Yalom" },
            { eser: "Yalnızız", yazar: "Peyami Safa" },
            { eser: "7.Kogus", yazar: "Anton Çehov" },
            { eser: "Ellerin Zamanlarla Dolu", yazar: "Paul Celan" },
            { eser: "Dava", yazar: "Franz Kafka" },
            { eser: "Doğu Yolculuğu", yazar: "Hermann Hesse" },
            { eser: "İnsanın Anlam Arayışı", yazar: "Viktor Frankl" },
            { eser: "Fareler ve İnsanlar", yazar: "John Steinbeck" }
        ];

        async function kitaplariGetir() {
            const alan = document.getElementById("icerik");

            alan.innerHTML = "<h2>📚 Sevdiğim Kitaplar</h2>";

            for (let kitapBilgi of kitapListem) {

                // yazar + eser şeklinde arama
                const arama = `${kitapBilgi.eser} ${kitapBilgi.yazar}`;

                const url =
                    "https://openlibrary.org/search.json?q=" +
                    encodeURIComponent(arama);

                const cevap = await fetch(url);
                const veri = await cevap.json();

                const kitap = veri.docs[0];

                if (!kitap) continue;

                const kapak = kitap.cover_i
                    ? `https://covers.openlibrary.org/b/id/${kitap.cover_i}-M.jpg`
                    : "https://via.placeholder.com/150x220?text=Kapak+Yok";

                alan.innerHTML += `
            <div class="card">
                <img src="${kapak}">
                <h3>${kitapBilgi.eser}</h3>
                <p>${kitapBilgi.yazar}</p>
            </div>
        `;
            }
        }

    </script>

</body>

</html>
