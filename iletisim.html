<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim Formu</title>
    <link rel="stylesheet" href="css/iletisim.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

    <div id="app" class="iletisim-sayfa">

        <!-- NAV -->
        <div class="konteynir">
            <nav>
                <a href="index.html">Hakkımda</a> |
                <a href="ozgecmis.html">Özgeçmiş</a> |
                <a href="sehrim.html">Şehrim</a> |
                <a href="mirasimiz.html">Takımımız</a> |
                <a href="ilgialanlarim.html">İlgi Alanlarım</a> |
                <a href="iletisim.html">İletişim</a> |
                <a href="login.html">Login</a>
            </nav>
        </div>

        <!-- BAŞLIK -->
        <div class="form-baslik">
            <h1>İletişim Formu</h1>
            <p>Aşağıdaki formu doldurarak bize ulaşabilirsiniz.</p>
        </div>

        <!-- FORM KUTUSU -->
        <div class="form-kutusu">
            <form id="contactForm" novalidate>

                <!-- Ad Soyad -->
                <div class="alan">
                    <label for="ad">Ad Soyad</label>
                    <input type="text" id="ad" v-model="form.ad" placeholder="Adınızı ve soyadınızı giriniz">
                </div>

                <!-- E-posta -->
                <div class="alan">
                    <label for="email">E-posta</label>
                    <input type="text" id="email" v-model="form.email" placeholder="ornek@mail.com">
                </div>

                <!-- Telefon -->
                <div class="alan">
                    <label for="telefon">Telefon</label>
                    <input type="text" id="telefon" v-model="form.telefon" placeholder="05xxxxxxxxx (10-11 hane)">
                </div>

                <!-- Konu (select) -->
                <div class="alan">
                    <label for="konu">Konu</label>
                    <select id="konu" v-model="form.konu">
                        <option value="">-- Seçiniz --</option>
                        <option value="oneri">Öneri</option>
                        <option value="sikayet">Şikayet</option>
                        <option value="bilgi">Bilgi Talebi</option>
                        <option value="diger">Diğer</option>
                    </select>
                </div>

                <!-- Cinsiyet (radio) -->
                <div class="alan">
                    <label>Cinsiyet</label>
                    <div class="secim-grubu">
                        <label class="secim-etiket">
                            <input type="radio" name="cinsiyet" value="Kadın" v-model="form.cinsiyet">
                            <span>Kadın</span>
                        </label>
                        <label class="secim-etiket">
                            <input type="radio" name="cinsiyet" value="Erkek" v-model="form.cinsiyet">
                            <span>Erkek</span>
                        </label>
                        <label class="secim-etiket">
                            <input type="radio" name="cinsiyet" value="Belirtmek İstemiyorum" v-model="form.cinsiyet">
                            <span>Belirtmek İstemiyorum</span>
                        </label>
                    </div>
                </div>

                <!-- İletişim Tercihi (checkbox) -->
                <div class="alan">
                    <label>İletişim Tercihi</label>
                    <div class="secim-grubu">
                        <label class="secim-etiket">
                            <input type="checkbox" value="E-posta" v-model="form.tercihler">
                            <span>E-posta</span>
                        </label>
                        <label class="secim-etiket">
                            <input type="checkbox" value="Telefon" v-model="form.tercihler">
                            <span>Telefon</span>
                        </label>
                        <label class="secim-etiket">
                            <input type="checkbox" value="SMS" v-model="form.tercihler">
                            <span>SMS</span>
                        </label>
                    </div>
                </div>

                <!-- Mesaj (textarea) -->
                <div class="alan">
                    <label for="mesaj">Mesaj</label>
                    <textarea id="mesaj" v-model="form.mesaj" placeholder="Mesajınızı buraya yazınız..."></textarea>
                </div>

                <!-- KVKK (checkbox) -->
                <div class="alan kvkk-alan">
                    <label class="kvkk-etiket">
                        <input type="checkbox" id="onay" v-model="form.onay">
                        <span>KVKK metnini okudum ve kabul ediyorum.</span>
                    </label>
                </div>

                <!-- BUTONLAR -->
                <div class="buton-grubu">
                    <button type="button" class="btn-native" onclick="nativeKontrol()">
                        🔍 Native JS ile Kontrol Et
                    </button>
                    <button type="button" class="btn-vue" @click="vueKontrol">
                        ⚡ Vue.js ile Kontrol Et
                    </button>
                </div>

            </form>

            <!-- SONUÇLAR -->
            <div id="nativeSonuc" class="sonuc-kutusu" style="display:none;"></div>
            <div class="sonuc-kutusu" v-if="vueSonuc" :class="vueSonucTuru">{{ vueSonuc }}</div>

        </div>
    </div>

    <script>
        // =====================
        // NATIVE JAVASCRIPT
        // =====================
        function nativeKontrol() {
            const ad = document.getElementById("ad").value.trim();
            const email = document.getElementById("email").value.trim();
            const telefon = document.getElementById("telefon").value.trim();
            const konu = document.getElementById("konu").value;
            const mesaj = document.getElementById("mesaj").value.trim();
            const onay = document.getElementById("onay").checked;

            const cinsiyetSecili = document.querySelector('input[name="cinsiyet"]:checked');
            const tercihler = document.querySelectorAll('input[type="checkbox"][value]:checked');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const telefonRegex = /^[0-9]{10,11}$/;

            const sonucDiv = document.getElementById("nativeSonuc");
            sonucDiv.style.display = "block";

            let mesajMetin = "";
            let hata = false;

            if (!ad || !email || !telefon || !konu || !mesaj) {
                mesajMetin = "⚠️ Native JS: Lütfen tüm zorunlu alanları doldurunuz.";
                hata = true;
            } else if (!emailRegex.test(email)) {
                mesajMetin = "⚠️ Native JS: Geçerli bir e-posta adresi giriniz.";
                hata = true;
            } else if (!telefonRegex.test(telefon)) {
                mesajMetin = "⚠️ Native JS: Telefon 10 veya 11 haneli ve yalnızca rakamlardan oluşmalıdır.";
                hata = true;
            } else if (!cinsiyetSecili) {
                mesajMetin = "⚠️ Native JS: Lütfen cinsiyet seçiniz.";
                hata = true;
            } else if (tercihler.length === 0) {
                mesajMetin = "⚠️ Native JS: En az bir iletişim tercihi seçiniz.";
                hata = true;
            } else if (!onay) {
                mesajMetin = "⚠️ Native JS: KVKK onayını işaretlemelisiniz.";
                hata = true;
            } else {
                mesajMetin = "✅ Native JS: Form başarıyla doğrulandı!";
            }

            sonucDiv.textContent = mesajMetin;
            sonucDiv.className = "sonuc-kutusu " + (hata ? "sonuc-hata" : "sonuc-basari");
        }

        // =====================
        // VUE.JS
        // =====================
        Vue.createApp({
            data() {
                return {
                    vueSonuc: "",
                    vueSonucTuru: "",
                    form: {
                        ad: "",
                        email: "",
                        telefon: "",
                        konu: "",
                        cinsiyet: "",
                        tercihler: [],
                        mesaj: "",
                        onay: false
                    }
                };
            },
            methods: {
                vueKontrol() {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    const telefonRegex = /^[0-9]{10,11}$/;

                    if (!this.form.ad || !this.form.email || !this.form.telefon ||
                        !this.form.konu || !this.form.mesaj) {
                        this.vueSonuc = "⚠️ Vue.js: Lütfen tüm zorunlu alanları doldurunuz.";
                        this.vueSonucTuru = "sonuc-hata";
                    } else if (!emailRegex.test(this.form.email)) {
                        this.vueSonuc = "⚠️ Vue.js: E-posta formatı hatalı.";
                        this.vueSonucTuru = "sonuc-hata";
                    } else if (!telefonRegex.test(this.form.telefon)) {
                        this.vueSonuc = "⚠️ Vue.js: Telefon 10 veya 11 haneli ve yalnızca rakamlardan oluşmalıdır.";
                        this.vueSonucTuru = "sonuc-hata";
                    } else if (!this.form.cinsiyet) {
                        this.vueSonuc = "⚠️ Vue.js: Lütfen cinsiyet seçiniz.";
                        this.vueSonucTuru = "sonuc-hata";
                    } else if (this.form.tercihler.length === 0) {
                        this.vueSonuc = "⚠️ Vue.js: En az bir iletişim tercihi seçiniz.";
                        this.vueSonucTuru = "sonuc-hata";
                    } else if (!this.form.onay) {
                        this.vueSonuc = "⚠️ Vue.js: KVKK onayını kabul etmelisiniz.";
                        this.vueSonucTuru = "sonuc-hata";
                    } else {
                        this.vueSonuc = "✅ Vue.js: Form başarıyla doğrulandı!";
                        this.vueSonucTuru = "sonuc-basari";
                    }
                }
            }
        }).mount("#app");
    </script>

</body>

</html>
